<!DOCTYPE html>
<html><!-- pas de lang : posé par le proxy data-fair -->
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>@layer vuetify-core, vuetify-components, vuetify-overrides, vuetify-utilities, vuetify-final;</style>
    <link href="/simple-directory/api/sites/_theme.css" rel="stylesheet">
    <link rel="icon" href="/favicon.png">

    <title>Formulaire de saisie</title><!-- nom du modèle : le proxy le remplace par le titre de l'application -->

    <!-- contrat data-fair, lu à l'exécution -->
    <meta name="df:vjsf" content="3">
    <meta name="df:filter-concepts" content="false">
    <meta name="df:sync-config" content="true">
    <meta name="df:sync-state" content="true">
    <meta name="df:overflow" content="true">
    <meta name="df:capture-delay" content="5">

    <!-- catalogue, lu à l'import -->
    <meta name="application-name" content="app-form">
    <meta name="description" lang="fr"
      content="Cette application permet de configurer un formulaire de saisie ouvert à tout le monde pour un jeu de données éditable.">

    <!-- infos publiques du site (thème, couleurs, locale), lues par createSession -->
    <script src="/simple-directory/api/sites/_public.js"></script>
    <script>window.APPLICATION=%APPLICATION%;</script>
  </head>
  <body>
    <div id="app" style="height:100vh"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
